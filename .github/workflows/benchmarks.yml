name: benchmarks

# Runs the suites and publishes the report, plus one entry in the history
# that GitHub Pages shows as trends (bench/ci_site/index.html). One job per
# suite, in parallel: every SDK of a suite is measured on the same machine,
# so servers compare within a suite; the wall time is the slowest suite.
# Triggers:
# - when a pinned SDK version changes on the default branch (quick profile),
# - every week (standard profile),
# - on demand, on any branch (sdk-watch dispatches its bump branches here).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "quick (throughput + capacity) or standard (all four suites)"
        type: choice
        options: [quick, standard]
        default: quick
      servers:
        description: "Comma-separated server SDKs (empty = all)"
        type: string
        default: ""
      runner:
        description: "runs-on label (empty: the BENCH_RUNNER repository variable, else ubuntu-24.04)"
        type: string
        default: ""
      publish:
        description: "Publish the report and add the run to the history on GitHub Pages"
        type: boolean
        default: true
  schedule:
    - cron: "23 2 * * 0"
  push:
    branches: [main]
    paths:
      - requirements.txt
      - common/node/package.json
      - common/milo/pom.xml
      - common/gopcua/go.mod
      - common/sdk_toolchains.json
      - common/dotnet/toolchain.json
      - deps/open62541
      - deps/ua-dotnet

permissions:
  contents: read

concurrency:
  # Collapses repeated triggers of the same ref. A self-hosted runner executes
  # one job at a time, so the suite jobs then run one after the other.
  group: benchmarks-${{ github.ref }}-${{ inputs.profile }}-${{ inputs.servers }}-${{ inputs.runner || vars.BENCH_RUNNER }}
  cancel-in-progress: false

env:
  PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'standard') || 'quick' }}
  PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name != 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          echo "suites=$(python3 -m bench.ci plan --profile "$PROFILE")" >> "$GITHUB_OUTPUT"
          echo "run_id=$(date -u +%F)-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    # A repository variable picks the machine of scheduled and push runs: a dedicated
    # self-hosted runner gives numbers comparable from one run to the next.
    runs-on: ${{ inputs.runner || vars.BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    env:
      BENCH_SERVERS: ${{ inputs.servers }}
      RUNNER_LABEL: ${{ inputs.runner || vars.BENCH_RUNNER || 'ubuntu-24.04' }}
      OUT: results/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # A self-hosted machine keeps its pinned toolchains and builds (ignored files)
          # between runs; the build's preflight rebuilds whatever a pin change made stale.
          clean: ${{ runner.environment == 'github-hosted' }}

      # A self-hosted machine brings its own Python 3.11+ and build tools (docs/self-hosted-runner.md).
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: System packages
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update -q && sudo apt-get install -yq build-essential cmake libssl-dev

      - name: Python environment
        run: |
          python3 -m venv --clear .venv
          .venv/bin/python -m pip install -q -r requirements.txt

      - name: Build workers
        run: .venv/bin/python -m bench.build --node --dotnet --sdks

      - name: Run ${{ matrix.suite }}
        run: |
          rm -rf "$OUT"  # a self-hosted machine keeps the previous run's results
          servers=${BENCH_SERVERS:-}
          .venv/bin/python -m bench.ci run "$OUT/bench.db" --profile "$PROFILE" --suite "${{ matrix.suite }}" ${servers:+--servers "$servers"}

      - name: Build report and summary
        if: always() && hashFiles(format('{0}/bench.db', env.OUT)) != ''
        run: |
          # Exit code 2 means the report rendered partially (an SDK failed): still publish it.
          .venv/bin/python -m bench.show "$OUT/bench.db" --cdn --export "$OUT/site" || [ $? -eq 2 ]
          .venv/bin/python -m bench.ci summary "$OUT/bench.db" --profile "$PROFILE" --out "$OUT/site/summary.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.suite }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn

  publish:
    needs: [plan, bench]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh-pages
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: artifacts

      - name: Merge the suites
        run: |
          mkdir -p run
          for dir in artifacts/suite-*; do
            suite=${dir#artifacts/suite-}
            [ -f "$dir/site/summary.json" ] && cp -r "$dir/site" "run/$suite"
          done
          ls run/*/summary.json > /dev/null 2>&1 || { echo "::error::no suite produced results"; exit 1; }
          python3 -m bench.ci merge run/*/summary.json --id "$RUN_ID" --site run --out run/summary.json

      - name: Compare with the published history
        run: |
          git fetch -q --depth=1 origin gh-pages 2>/dev/null && git show FETCH_HEAD:data/history.json > "$RUNNER_TEMP/history.json" || true
          python3 -m bench.ci compare run/summary.json "$RUNNER_TEMP/history.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        if: env.PUBLISH == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin gh-pages; then
            git worktree add -q pages FETCH_HEAD
          else
            git worktree add -q --detach pages
            git -C pages checkout -q --orphan gh-pages
            git -C pages rm -rqf --ignore-unmatch .
          fi
          # Retried from the fresh remote tip if another run published meanwhile.
          for attempt in 1 2 3 4 5; do
            mkdir -p "pages/runs/$RUN_ID" pages/data
            cp -r run/. "pages/runs/$RUN_ID/"
            cp bench/ci_site/index.html pages/index.html
            touch pages/.nojekyll
            python3 -m bench.ci append pages/data/history.json run/summary.json
            git -C pages add -A
            git -C pages commit -q -m "Benchmark run $RUN_ID ($PROFILE)"
            git -C pages push -q origin HEAD:gh-pages && break
            git -C pages fetch -q origin gh-pages
            git -C pages reset -q --hard FETCH_HEAD
          done
          echo "Published: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/runs/$RUN_ID/" >> "$GITHUB_STEP_SUMMARY"
